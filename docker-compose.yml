services:
  data-ingest:
    build:
      context: ./apps/data-ingest
      dockerfile: Dockerfile
    container_name: data-ingest
    env_file:
      - ./localdeployment/dev.env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      JAVA_OPTS: "-XX:MaxRAMPercentage=75"
    depends_on:
      - kafka
    volumes:
      - ./apps/data-ingest/build/libs/data-ingest.jar:/app/data-ingest.jar:ro
    ports:
      - "8080:8080"
    networks:
      - eits

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft mode
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      # Listeners
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      # Storage
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Other
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - eits

  kafka-init:
    image: apache/kafka:latest
    container_name: kafka-init
    depends_on:
      - kafka
    volumes:
      - ./localdeployment/kafka/create_topics.sh:/create_topics.sh
    entrypoint: [ "/bin/bash", "/create_topics.sh" ]
    networks:
      - eits

  kafka-console:
    image: redpandadata/console:latest
    container_name: kafka-console
    ports:
      - "9099:8080"
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: console
      KAFKA_SASL_ENABLED: "false"
      KAFKA_PROTOBUF_FILEPATH: /schemas/schema.desc
      PROTOBUF_SCHEMA_PATH: /schemas/schema.desc
      KAFKA_PROTOBUF_MESSAGE_TYPE_MAP: |
        current-flights-data=walerowicz.eits.ingest.v1.StateVector
    volumes:
      - ./data-schemas/ingestion/build/descriptors:/schemas
    depends_on:
      - kafka
    networks:
      - eits

volumes:
  kafka_data:

networks:
  eits:
    driver: bridge
